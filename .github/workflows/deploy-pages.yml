name: Deploy to GitHub Pages

# Publishes the site at https://<owner>.github.io/<repo>/ with no login.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Runs on every push to the default branch, and after each scheduled data update
# (commits pushed by the update job use GITHUB_TOKEN, which does not trigger
# `push` workflows, so `workflow_run` is used to redeploy).
on:
  push:
  workflow_run:
    workflows: ["Update box office data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
