name: Update box office data

# Update slots: 08:00, 15:00 and 22:00 Asia/Kolkata (UTC+05:30).
# GitHub may start scheduled runs late or drop them under load, so each slot has
# a primary trigger plus two backups at off-peak minutes. scripts/pipeline/slot-check.mjs
# lets only the first trigger that fires in a slot update the data.
# The site shows each run's actual finish time. Scheduled workflows only run
# from the repository's default branch.
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
    - cron: '47 2 * * *'   # 08:17 IST backup
    - cron: '23 3 * * *'   # 08:53 IST backup
    - cron: '30 9 * * *'   # 15:00 IST
    - cron: '47 9 * * *'   # 15:17 IST backup
    - cron: '23 10 * * *'  # 15:53 IST backup
    - cron: '30 16 * * *'  # 22:00 IST
    - cron: '47 16 * * *'  # 22:17 IST backup
    - cron: '23 17 * * *'  # 22:53 IST backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this slot is already done
        id: slot
        run: node scripts/pipeline/slot-check.mjs

      - uses: actions/setup-node@v4
        if: steps.slot.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.slot.outputs.skip != 'true'
        run: npm ci

      - name: Run data pipeline
        id: pipeline
        if: steps.slot.outputs.skip != 'true'
        continue-on-error: true
        env:
          RUN_TRIGGER: github:${{ github.event_name }}
        run: npm run pipeline

      - name: Verify the site still builds
        if: steps.slot.outputs.skip != 'true' && steps.pipeline.outcome == 'success'
        run: npm run build

      - name: Commit updated dataset and run log
        if: steps.slot.outputs.skip != 'true'
        run: |
          git config user.name "box-office-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/site-data.json data/state/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: scheduled update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST') [${{ steps.pipeline.outcome }}]"
            git push
          fi

      - name: Fail the job if the pipeline failed
        if: steps.slot.outputs.skip != 'true' && steps.pipeline.outcome != 'success'
        run: |
          echo "::error::Pipeline failed. Previous dataset kept; see data/state/runs.json."
          exit 1
